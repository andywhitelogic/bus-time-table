<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b3d91" />
  <title>Bus Times</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <section class="controls" aria-label="Choose your journey">
      <div class="field field-route">
        <span>Bus</span>
        <select id="route-select"></select>
        <strong id="route-static"></strong>
      </div>

      <label class="field">
        <span>Day</span>
        <select id="day-select"></select>
      </label>

      <div class="field-picker">
        <label class="field">
          <span>From</span>
          <select id="from-select"></select>
        </label>
        <button id="swap-btn" type="button" title="Swap departure and arrival" aria-label="Swap departure and arrival">⇄</button>
        <label class="field">
          <span>To</span>
          <select id="to-select"></select>
        </label>
      </div>
    </section>

    <p id="route-line" class="route-line"></p>

    <section class="next-buses" aria-live="polite">
      <h2>Departures</h2>
      <ol id="next-list" class="next-list"></ol>
      <p id="next-empty" class="empty" hidden>No more buses today.</p>
      <p id="next-none" class="empty" hidden></p>
      <p class="hint">Tap a journey to see the stops in between.</p>
    </section>

    <section class="full-timetable">
      <button id="toggle-timetable" class="toggle" aria-expanded="false">
        Show full timetable
      </button>
      <div id="timetable-wrap" class="timetable-wrap" hidden></div>
    </section>
  </main>

  <footer class="app-footer">
    <p id="data-note"></p>
    <p class="disclaimer">Always check with the operator before travelling.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
